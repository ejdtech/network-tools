<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subnet Calculator — Network Tools</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="site-header">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
    <div><h1>Network Tools</h1><p>Simple Tools for System Administrators</p></div>
  </div>
  <nav class="main-nav">
    <a href="../index.html">Home</a>
    <a href="../index.html#tools">Tools</a>
    <a href="../about.html">About</a>
    <a href="../contact.html">Contact</a>
  </nav>
</header>

<div class="tool-page">
  <a class="back-link" href="../index.html">&larr; Back to all tools</a>
  <h2>Subnet Calculator</h2>
  <p class="desc">Enter an IPv4 address and a CIDR prefix (or subnet mask) to calculate the network range. All calculations happen in your browser — no data is sent anywhere.</p>

  <div class="tool-box">
    <div class="field">
      <label for="ipInput">IP Address</label>
      <input type="text" id="ipInput" placeholder="e.g. 192.168.1.10" value="192.168.1.10">
    </div>
    <div class="field">
      <label for="cidrInput">CIDR Prefix (0-32)</label>
      <input type="number" id="cidrInput" min="0" max="32" placeholder="e.g. 24" value="24">
    </div>
    <div class="btn-row">
      <button class="btn" id="calcBtn">Calculate</button>
    </div>
    <div class="result" id="result" style="display:none;"></div>
    <div class="error" id="error"></div>
  </div>
</div>

<footer class="site-footer">
  <div><strong>Network Tools</strong></div>
  <div class="f-links"><a href="../index.html">Home</a></div>
</footer>

<script>
function ipToInt(ip){
  const parts = ip.trim().split('.');
  if (parts.length !== 4) return null;
  let n = 0;
  for (const p of parts){
    if (!/^\d+$/.test(p)) return null;
    const v = parseInt(p, 10);
    if (v < 0 || v > 255) return null;
    n = (n << 8) | v;
  }
  return n >>> 0;
}
function intToIp(n){
  return [(n>>>24)&255, (n>>>16)&255, (n>>>8)&255, n&255].join('.');
}
function row(k, v){
  return `<div class="result-row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
}

document.getElementById('calcBtn').addEventListener('click', () => {
  const errorEl = document.getElementById('error');
  const resultEl = document.getElementById('result');
  errorEl.textContent = '';
  resultEl.style.display = 'none';

  const ip = document.getElementById('ipInput').value;
  const cidr = parseInt(document.getElementById('cidrInput').value, 10);

  const ipInt = ipToInt(ip);
  if (ipInt === null){
    errorEl.textContent = 'Please enter a valid IPv4 address, e.g. 192.168.1.10';
    return;
  }
  if (isNaN(cidr) || cidr < 0 || cidr > 32){
    errorEl.textContent = 'CIDR prefix must be a number between 0 and 32.';
    return;
  }

  const maskInt = cidr === 0 ? 0 : (0xFFFFFFFF << (32 - cidr)) >>> 0;
  const wildcardInt = (~maskInt) >>> 0;
  const networkInt = (ipInt & maskInt) >>> 0;
  const broadcastInt = (networkInt | wildcardInt) >>> 0;
  const totalHosts = Math.pow(2, 32 - cidr);
  let usableHosts, firstUsable, lastUsable;

  if (cidr >= 31){
    usableHosts = cidr === 32 ? 1 : 2;
    firstUsable = intToIp(networkInt);
    lastUsable = intToIp(broadcastInt);
  } else {
    usableHosts = totalHosts - 2;
    firstUsable = intToIp(networkInt + 1);
    lastUsable = intToIp(broadcastInt - 1);
  }

  let html = '';
  html += row('Network Address', intToIp(networkInt));
  html += row('Broadcast Address', intToIp(broadcastInt));
  html += row('Subnet Mask', intToIp(maskInt));
  html += row('Wildcard Mask', intToIp(wildcardInt));
  html += row('CIDR Notation', `/${cidr}`);
  html += row('Total Addresses', totalHosts.toLocaleString());
  html += row('Usable Hosts', usableHosts.toLocaleString());
  html += row('First Usable IP', firstUsable);
  html += row('Last Usable IP', lastUsable);

  resultEl.innerHTML = html;
  resultEl.style.display = 'block';
});
</script>
</body>
</html>
